name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out plugin
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Package VSIX
        run: npm run package

      - name: Verify VSIX contents
        run: |
          set -euo pipefail
          VSIX=$(ls at-grafana-*.vsix | head -n 1)
          echo "Inspecting $VSIX"
          unzip -l "$VSIX" > vsix-contents.txt
          grep -q 'extension/dist/extension.js' vsix-contents.txt
          grep -q 'extension/dist/hub.js' vsix-contents.txt
          grep -q 'extension/l10n/bundle.l10n.zh-cn.json' vsix-contents.txt
          if grep -Eq '\.map$' vsix-contents.txt; then
            echo 'Unexpected source map in VSIX' >&2
            exit 1
          fi

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: at-grafana-vsix
          path: at-grafana-*.vsix
          if-no-files-found: error
